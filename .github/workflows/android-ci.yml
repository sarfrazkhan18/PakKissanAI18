name: Android CI

# Compile check for the app. Runs on every pull request (and on pushes to main)
# so the branch gets a real build — this repo is otherwise only inspection-verified.
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.1.x requires JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # No Gradle wrapper is committed; AGP 9.1.1 requires Gradle 9.1.0.
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      # The debug build type signs with ${rootDir}/debug.keystore, which is gitignored.
      # Generate the standard Android debug keystore so packaging can complete.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # No .env is committed; the Secrets Gradle Plugin falls back to .env.example
      # (placeholder key), so the build compiles without any real secret.

      # Compile-cache is disabled here to avoid config-cache serialization noise on a
      # first CI run; the goal is a clean, reliable compile signal.
      - name: Compile unit test sources
        run: gradle :app:compileDebugUnitTestKotlin --no-configuration-cache --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-configuration-cache --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
